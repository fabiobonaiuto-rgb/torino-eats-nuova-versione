document.getElementById("menu-add").addEventListener("click",()=>openRestaurantDialog());
document.getElementById("export-data").addEventListener("click",exportPreviewData);
document.getElementById("import-data").addEventListener("click",()=>document.getElementById("import-data-file").click());
document.getElementById("import-data-file").addEventListener("change",e=>importPreviewData(e.target.files?.[0]));
document.getElementById("reset-preview").addEventListener("click",resetPreview);
document.getElementById("restaurant-form").addEventListener("submit",submitRestaurantForm);
document.getElementById("confirm-delete").addEventListener("click",deleteRestaurant);
document.getElementById("form-image").addEventListener("change",e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const p=document.getElementById("image-preview");p.src=reader.result;p.dataset.value=reader.result;p.style.display="block";document.getElementById("image-help").textContent="Fotografia selezionata"};reader.readAsDataURL(file)});
document.addEventListener("input",e=>{if(e.target.id==="home-search"){const cursor=e.target.selectionStart;closePersonalStatusMenu(false);homeQuery=e.target.value;renderHome();const input=document.getElementById("home-search");input.focus();input.setSelectionRange(cursor,cursor)}if(e.target.id==="map-search"){const cursor=e.target.selectionStart;mapQuery=e.target.value;renderMap();const input=document.getElementById("map-search");input.focus();input.setSelectionRange(cursor,cursor)}});
document.addEventListener("change",e=>{if(e.target.id==="home-sort"){homeSort=e.target.value;renderHome(true)}if(e.target.id==="map-category"){mapCategory=e.target.value||null;renderMap()}});
document.addEventListener("keydown",handleGlobalKeydown);
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{if(currentView==="map")setMapView(mapCenter,mapZoom)});
parseHash();render();
</script>
</body>
</html>
